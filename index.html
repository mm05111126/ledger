<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的記帳本</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="記帳本">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one narrow phone column — month header, summary, budget, category bars, daily ledger; a floating + opens a bottom sheet. */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --surface-2:#e8eeec; --fg:#17211f; --muted:#5d6d69; --line:#d5dfdc;
  --accent:#0f6b5c; --accent-fg:#ffffff; --exp:#c2412d; --inc:#1f7a3f; --warn:#b7791f;
  --c1:#0f6b5c; --c2:#d97a2b; --c3:#3d6fb6; --c4:#9a4fa8; --c5:#c2412d; --c6:#2f9a8a; --c7:#b8962e; --c8:#7a8784;
  --shadow:0 10px 30px rgba(15,40,35,.12);
  --pig:#f7b3c2; --pig-d:#e88aa2; --pig-ink:#4a1f2b; --coin:#f5c542; --coin-d:#b8860b; --drop:#6cc4f0;
  --f-text:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Space Grotesk","Noto Sans TC",ui-monospace,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1514; --surface:#162120; --surface-2:#1f2c2a; --fg:#e6eeec; --muted:#93a5a1; --line:#2a3a37;
  --accent:#4cc3ad; --accent-fg:#06201b; --exp:#ff8a73; --inc:#6fd394; --warn:#e8b155;
  --c1:#4cc3ad; --c2:#f0a05a; --c3:#7aa7ea; --c4:#c88ad4; --c5:#ff8a73; --c6:#5fd0c0; --c7:#e0c060; --c8:#9aa8a5;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
  --pig:#f0a3b5; --pig-d:#d77892; --pig-ink:#3a1520; --coin:#f5c542; --coin-d:#9a6f00; --drop:#7fd0f5}}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#162120; --surface-2:#1f2c2a; --fg:#e6eeec; --muted:#93a5a1; --line:#2a3a37;
  --accent:#4cc3ad; --accent-fg:#06201b; --exp:#ff8a73; --inc:#6fd394; --warn:#e8b155;
  --c1:#4cc3ad; --c2:#f0a05a; --c3:#7aa7ea; --c4:#c88ad4; --c5:#ff8a73; --c6:#5fd0c0; --c7:#e0c060; --c8:#9aa8a5;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark;
  --pig:#f0a3b5; --pig-d:#d77892; --pig-ink:#3a1520; --coin:#f5c542; --coin-d:#9a6f00; --drop:#7fd0f5}
/* White skin: chosen by the viewer, always light, plain white page with soft card shadows */
:root[data-skin="white"]{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f2f5f4; --fg:#17211f; --muted:#5d6d69; --line:#e3e9e7;
  --accent:#0f6b5c; --accent-fg:#ffffff; --exp:#c2412d; --inc:#1f7a3f; --warn:#b7791f;
  --c1:#0f6b5c; --c2:#d97a2b; --c3:#3d6fb6; --c4:#9a4fa8; --c5:#c2412d; --c6:#2f9a8a; --c7:#b8962e; --c8:#7a8784;
  --shadow:0 10px 30px rgba(15,40,35,.12);
  --pig:#f7b3c2; --pig-d:#e88aa2; --pig-ink:#4a1f2b; --coin:#f5c542; --coin-d:#b8860b; --drop:#6cc4f0;
  color-scheme:light}
:root[data-skin="white"] .card{box-shadow:0 2px 10px rgba(15,40,35,.06)}

*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.login{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.login-in{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px;text-align:center}
.login-in h1{margin:0;font-size:24px}
.login-pig{width:132px;height:110px;margin:0 auto}
.login-pig svg{width:100%;height:100%;overflow:visible}
.login form{display:flex;flex-direction:column;gap:10px}
.login .btn{width:100%}
.login .err,.login .ok{text-align:left}
.ok{color:var(--inc);font-size:13px;margin:0}
.who{display:flex;justify-content:center;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-text);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px;display:flex;flex-direction:column;gap:14px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding-block:12px 6px}
header{min-height:56px}
.tabs{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:3px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:700;color:var(--muted);font-size:15px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.view{display:flex;flex-direction:column;gap:14px}
.month{display:flex;align-items:center;gap:4px}
.month button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px}
.month span{min-width:96px;text-align:center;font-weight:500}

.notice{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 12px}
.notice[data-kind="warn"]{color:var(--warn)}

.summary{background:var(--accent);color:var(--accent-fg);border-radius:18px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.summary .lbl{font-size:12px;letter-spacing:.06em;opacity:.85}
.summary .bal{font-size:34px;font-weight:700;line-height:1.1}
.summary .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summary .row div{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 12px}
.summary .row b{display:block;font-size:18px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h2 small{font-weight:400;color:var(--muted);font-size:12px}
.linkbtn{background:none;border:0;color:var(--accent);font-size:13px;padding:4px 0}

.track{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.track i.over{background:var(--exp)}
.track i.near{background:var(--warn)}
.bud-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.bud-edit{display:flex;gap:8px}
.bud-edit input{flex:1;min-width:0}

.cats{display:flex;flex-direction:column;gap:9px}
.cat{display:grid;grid-template-columns:22px 3.5em 1fr auto;align-items:center;gap:8px;font-size:14px}
.cat .dot{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;color:#fff;font-weight:700}
.cat .bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.cat .bar i{display:block;height:100%;border-radius:99px}
.cat .amt{font-size:14px;text-align:right;min-width:5.5em}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:14px 4px}

.day{display:flex;flex-direction:column}
.day-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:6px 2px;border-bottom:1px solid var(--line)}
.tx{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.tx:last-child{border-bottom:0}
.tx .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.tx .t{min-width:0}
.tx .t b{font-weight:500;display:block}
.tx .t small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:700;font-size:16px}
.a.exp{color:var(--exp)} .a.inc{color:var(--inc)}

.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);font-size:32px;line-height:1;box-shadow:var(--shadow);z-index:6}

.scrim{position:fixed;inset:0;background:rgba(5,15,13,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);max-height:92vh;overflow-y:auto;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 4px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:12px;padding:4px}
.seg button{border:0;background:none;padding:8px;border-radius:9px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.amount-in{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--accent);padding-bottom:4px}
.amount-in span{color:var(--muted);font-size:18px}
.amount-in input{border:0;background:none;font-family:var(--f-num);font-size:36px;font-weight:700;width:100%;min-width:0;color:var(--fg);padding:0}
.amount-in input:focus{outline:none}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}
.chip i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--accent)}
.fields{display:grid;grid-template-columns:auto 1fr;gap:8px}
input.f,select.f{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
.actions{display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:12px;padding:13px;font-weight:700;background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:var(--surface-2);color:var(--fg);flex:0 0 auto;padding-inline:18px}
.btn.danger{background:none;color:var(--exp);border:1px solid var(--exp);flex:0 0 auto;padding-inline:16px}
.btn.danger.armed{background:var(--exp);color:#fff}
.err{color:var(--exp);font-size:13px;margin:0}
.worth{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.worth span{font-size:13px;color:var(--muted)}
.worth b{font-size:26px;font-weight:700}
.mix{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2);gap:2px}
.mix span{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.leg i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:4px;vertical-align:1px}
.a.neu{color:var(--fg)}
.chips.five{grid-template-columns:repeat(5,1fr)}
.chips.five .chip{font-size:12px;padding-inline:2px}
.stock-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:12px;color:var(--muted);margin:0}
.pay{display:flex;flex-direction:column;gap:8px}
.pay-h{font-size:13px;font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pay-h small{font-weight:400;color:var(--muted);font-size:12px;text-align:right}
.paychips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.pchip i{width:9px;height:9px;border-radius:3px;display:inline-block}
.pchip[aria-pressed="true"]{border-color:var(--accent);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--accent)}
.sync{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.sync input{width:18px;height:18px;accent-color:var(--accent)}
.sheet-title{font-weight:700;text-align:center;font-size:16px}
.pill{font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;background:var(--surface-2);color:var(--muted)}
.pill.ok{color:var(--inc)} .pill.warn{color:var(--warn)}
.remind{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--warn);border-radius:14px;padding:10px 12px}
.rpig{width:44px;height:38px;display:block}
.rpig svg{width:100%;height:100%;overflow:visible}
.rtxt{min-width:0}
.rtxt b{display:block;font-size:14px}
.rtxt small{display:block;color:var(--muted);font-size:12px}
.rbtns{display:flex;flex-direction:column;align-items:center;gap:2px}
.rbtns .btn{padding:8px 16px;flex:none}
.rbtns .linkbtn{color:var(--muted);font-size:12px;padding:2px}
.skin{display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;color:var(--muted);padding-top:4px}
.skin .seg{width:210px}
.skin .seg button{display:flex;align-items:center;justify-content:center;gap:6px}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);display:inline-block}
.bk-every{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.bk-every select{width:auto;padding:6px 10px}
.tx.paused{opacity:.5}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);border:1px solid currentColor;border-radius:6px;padding:0 5px;margin-right:6px;line-height:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:30}
.summary{position:relative;overflow:hidden}
.pig{position:absolute;top:8px;right:8px;width:84px;height:72px;border:0;background:none;padding:0;transform-origin:50% 90%}
.pig svg{width:100%;height:100%;display:block;overflow:visible}
.pig.bounce{animation:boing .6s ease-out}
@keyframes boing{0%{transform:scale(1)}30%{transform:scale(1.18,.86)}60%{transform:scale(.94,1.1)}100%{transform:scale(1)}}
.pig .tail{transform-origin:102px 54px;animation:wag 2.4s ease-in-out infinite}
@keyframes wag{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(18deg)}94%{transform:rotate(-12deg)}}
.bal-wrap{padding-right:84px}
.quip{font-size:13px;background:rgba(255,255,255,.16);border-radius:10px;padding:6px 10px;align-self:flex-start;max-width:100%}
.track i.gold{background:var(--coin)}
.coin{position:fixed;top:-30px;width:22px;height:22px;border-radius:50%;background:var(--coin);box-shadow:inset 0 0 0 3px var(--coin-d);z-index:40;pointer-events:none;animation:fall 1.4s ease-in forwards}
.coin::after{content:"$";display:grid;place-items:center;height:100%;font:700 12px/1 var(--f-num);color:var(--coin-d)}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
.floaty{position:fixed;right:max(24px,calc(env(safe-area-inset-right,0px) + 24px));bottom:calc(90px + env(safe-area-inset-bottom,0px));font:700 20px var(--f-num);color:var(--exp);z-index:40;pointer-events:none;animation:rise 1.2s ease-out forwards}
@keyframes rise{to{transform:translateY(-120px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}.pig.bounce,.pig .tail{animation:none}.coin,.floaty{display:none}}
</style>
</head>
<body>
<div class="login" id="login" hidden>
  <div class="login-in">
    <div class="login-pig" id="loginPig"></div>
    <h1>我的記帳本</h1>
    <p class="hint" id="loginSub">登入後，資料會安全地存在你自己的雲端帳號</p>
    <form id="loginForm">
      <input id="lEmail" class="f" type="email" autocomplete="email" placeholder="Email" required>
      <input id="lPass" class="f" type="password" autocomplete="current-password" placeholder="密碼（至少 6 個字）" required minlength="6">
      <p class="err" id="lErr" hidden></p>
      <p class="ok" id="lOk" hidden></p>
      <button class="btn" type="submit" id="lGo">登入</button>
    </form>
    <button type="button" class="linkbtn" id="lSwitch">還沒有帳號？建立一個</button>
    <button type="button" class="linkbtn" id="lForgot" style="color:var(--muted)">忘記密碼</button>
  </div>
</div>

<div class="wrap">
  <header>
    <div class="tabs" role="tablist" aria-label="切換頁面">
      <button type="button" role="tab" id="tabLedger" aria-selected="true">記帳本</button>
      <button type="button" role="tab" id="tabSave" aria-selected="false">存款</button>
    </div>
    <div class="month" id="monthNav">
      <button id="prevM" aria-label="上個月">‹</button>
      <span id="monthLbl">—</span>
      <button id="nextM" aria-label="下個月">›</button>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>

  <div class="remind" id="remind" hidden>
    <span class="rpig" id="rpig"></span>
    <div class="rtxt"><b>小豬提醒：該備份囉</b><small id="rSub"></small></div>
    <div class="rbtns">
      <button type="button" class="btn" id="rGo">備份</button>
      <button type="button" class="linkbtn" id="rLater">稍後</button>
    </div>
  </div>

  <div class="view" id="vLedger">
  <section class="summary" aria-label="本月總覽">
    <button type="button" class="pig" id="pigL" aria-label="戳一下小豬"></button>
    <div class="bal-wrap">
      <div class="lbl">本月結餘 <span id="days"></span></div>
      <div class="bal num" id="sBal">NT$ 0</div>
    </div>
    <div class="row">
      <div><span class="lbl">收入</span><b class="num" id="sInc">0</b></div>
      <div><span class="lbl">支出</span><b class="num" id="sExp">0</b></div>
    </div>
    <div class="quip" id="quipL">小豬正在醒來…</div>
  </section>

  <section class="card" aria-label="每月預算">
    <h2>每月預算 <button class="linkbtn" id="budBtn">設定</button></h2>
    <div id="budView">
      <div class="track"><i id="budBar" style="width:0%"></i></div>
      <div class="bud-meta" style="margin-top:6px"><span id="budUsed">尚未設定預算</span><span id="budLeft" class="num"></span></div>
    </div>
    <form id="budForm" class="bud-edit" hidden>
      <input id="budInput" class="f num" type="number" inputmode="numeric" min="0" placeholder="例如 20000">
      <button class="btn" style="flex:0 0 auto;padding-inline:18px" type="submit">儲存</button>
    </form>
    <p class="hint" id="recHint" hidden></p>
  </section>

  <section class="card" aria-label="固定收支">
    <h2>固定收支 <button class="linkbtn" id="recAdd">＋ 新增</button></h2>
    <div id="recList"></div>

function localStore(){
  const K='ledger.tx.v1', B='ledger.budget.v1';
  const read=()=>{try{return JSON.parse(localStorage.getItem(K)||'[]')}catch(e){return []}};
  const write=a=>{try{localStorage.setItem(K,JSON.stringify(a))}catch(e){}};
  let cb=null,month=null;
  const emit=()=>cb&&cb(read().filter(t=>t.month===month));
  return {
    listen(m,f){month=m;cb=f;emit();return()=>{cb=null}},
    async save(t){const a=read().filter(x=>x.id!==t.id);a.push(t);write(a);emit()},
    async remove(id){write(read().filter(x=>x.id!==id));emit()},
    async getTx(id){return read().some(x=>x.id===id)},

    ...accLocal()

    watchRecurring(f){cb=f;f(read())},
    async saveRec(r){const l=read().filter(x=>x.id!==r.id);l.push(r);write(l);cb&&cb(read())},

function dbStore(db,uid){
  const prof=db.collection('users').doc(uid);
  const col=prof.collection('tx');
  return {
    listen(m,f,err){return col.where('month','==',m).onSnapshot(s=>f(s.docs.map(d=>Object.assign({id:d.id},d.data())),s.metadata),err)},
    async save(t){const {id,...body}=t;await col.doc(id).set(body)},
    async remove(id){await col.doc(id).delete()},
    async getTx(id){return (await col.doc(id).get()).exists},
    async allTx(){const s=await col.get();return s.docs.map(d=>Object.assign({id:d.id},d.data()))},
    watchRecurring(f){prof.collection('recurring').onSnapshot(s=>f(s.docs.map(d=>Object.assign({id:d.id},d.data()))),()=>{})},
    async saveRec(r){const {id,...body}=r;await prof.collection('recurring').doc(id).set(body)},
    async removeRec(id){await prof.collection('recurring').doc(id).delete()},
    async setProfile(p){await prof.set(p)},
    watchProfile(f){prof.onSnapshot(s=>f(s.exists?s.data():{}),()=>{})},
    watchAccounts(f){prof.collection('accounts').onSnapshot(s=>f(s.docs.map(d=>Object.assign({id:d.id},d.data()))),()=>{})},
    async saveAcc(a){const {id,...body}=a;await prof.collection('accounts').doc(id).set(body)},
    async removeAcc(id){await prof.collection('accounts').doc(id).delete()}
  };
}

const addM=(m,n)=>{let y=+m.slice(0,4),mo=+m.slice(5,7)-1+n;y+=Math.floor(mo/12);mo=((mo%12)+12)%12;return y+'-'+pad(mo+1)};
const dim=m=>new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();
const dueDate=(m,day)=>m+'-'+pad(Math.min(day,dim(m)));
const nextDue=r=>dueDate(r.last?addM(r.last,1):r.start,r.day);
const fmtMD=d=>(+d.slice(5,7))+'/'+(+d.slice(8,10));
let recs=[],recLoaded=false,catching=false;
function renderRec(){
  const fixedExp=recs.filter(r=>!r.paused&&r.type==='exp').reduce((s,r)=>s+(Number(r.amount)||0),0);
  const h=$('recHint');h.hidden=!fixedExp;
  h.textContent=fixedExp?'固定支出每月 NT$ '+fmt(fixedExp)+(budget>0?'，佔預算 '+Math.round(fixedExp/budget*100)+'%，可自由花的還有 '+fmt(Math.max(0,budget-fixedExp)):''):'';
  const list=$('recList');list.textContent='';
  if(!recs.length){list.innerHTML='<div class="empty">房租、訂閱、薪水這類每月固定的，加進來就會自動記帳</div>';return}
  recs.slice().sort((a,b)=>(!!a.paused-!!b.paused)||(a.day-b.day)).forEach(r=>{
    const c=catOf(r.type,r.cat);const b=document.createElement('button');b.type='button';b.className='tx'+(r.paused?' paused':'');
    b.innerHTML='<span class="ic" style="background:var('+c[2]+')">'+c[1][0]+'</span><span class="t"><b></b><small></small></span><span class="a num '+r.type+'">'+(r.type==='inc'?'+':'−')+fmt(r.amount)+'</span>';
    b.querySelector('b').textContent=r.note||c[1];
    b.querySelector('small').textContent=[r.day===31?'每月月底':'每月 '+r.day+' 號',r.pay&&r.pay.label,r.paused?'已暫停':'下次 '+fmtMD(nextDue(r))].filter(Boolean).join(' · ');
    b.addEventListener('click',()=>openRec(r));list.appendChild(b);
  });
}
async function catchUp(){
  if(catching||!store||!recLoaded||!accLoaded)return;catching=true;
  try{
    const today=ymd(new Date());const posted=[],deltas=[];
    for(const r of recs){
      if(r.paused||!r.start)continue;
      let m=r.last?addM(r.last,1):r.start,last=r.last||null,guard=0;
      while(guard++<24){
        const d=dueDate(m,r.day);if(d>today)break;
        const id='r_'+r.id+'_'+m.replace('-','');
        if(!(await store.getTx(id))){
          const tx={id,type:r.type,cat:r.cat,amount:r.amount,date:d,month:m,note:r.note||'',pay:r.pay||null,synced:!!r.synced,created:new Date().toISOString(),rec:r.id};
          await store.save(tx);posted.push(tx);deltas.push([deltaOf(tx),1]);
        }
        last=m;m=addM(m,1);
      }
      if(last!==(r.last||null))await store.saveRec(Object.assign({},r,{last}));
    }
    if(deltas.length)await applyDeltas(deltas);
    if(posted.length){toast('已自動記入 '+posted.length+' 筆固定收支');bounce($('pigL'))}
  }catch(e){}finally{catching=false}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')catchUp()});

    try{await store.removeRec(recEdit.id);closeSheet();toast('已刪除固定項目，已記的明細會保留')}catch(x){$('err').textContent='刪除失敗，請再試一次。';$('err').hidden=false}
    return;
  }
  try{const old=editing;await store.remove(old.id);let m='已刪除';
    try{await applyDeltas([[deltaOf(old),-1]]);if(deltaOf(old))m+=' · '+old.pay.label+' 餘額已還原'}catch(x){m+=' · 帳戶餘額沒還原到'}
    closeSheet();toast(m)}catch(x){$('err').textContent='刪除失敗，請再試一次。';$('err').hidden=false}
};

/* ---------- backup ---------- */
const daysSince=iso=>Math.floor((Date.now()-new Date(iso).getTime())/86400000);
function renderBackup(){
  const every=profileObj.backupEvery==null?7:Number(profileObj.backupEvery);
  $('bkEvery').value=String(every);
  const last=profileObj.lastBackup,pill=$('bkPill');
  const what='備份檔包含全部月份的明細、帳戶、預算、存錢目標和固定收支。';
  if(last){const d=daysSince(last),dt=new Date(last);
    $('bkTxt').textContent='上次備份：'+(dt.getMonth()+1)+'/'+dt.getDate()+'（'+(d<=0?'今天':d+' 天前')+'）。'+what;
    const ok=!every||d<every;pill.textContent=ok?'安全':'該備份了';pill.className='pill '+(ok?'ok':'warn')}
  else{$('bkTxt').textContent='還沒備份過。'+what;pill.textContent='未備份';pill.className='pill warn'}
  const hasData=accs.length||txs.length||recs.length||budget||goal;
  let snoozed=false;try{snoozed=sessionStorage.getItem('ledger.snooze')==='1'}catch(e){}
  const due=!!(profLoaded&&every>0&&hasData&&(!last||daysSince(last)>=every)&&!snoozed);
  $('remind').hidden=!due;
  if(due){$('rSub').textContent=last?'已經 '+daysSince(last)+' 天沒備份了，按一下就好':'還沒備份過，先存一份比較安心';
    if(!$('rpig').innerHTML)$('rpig').innerHTML=pigSVG('worry',0,'R')}
}
async function doBackup(){
  const btns=[$('bkBtn'),$('rGo')];btns.forEach(b=>b.disabled=true);
  try{
    const all=await store.allTx();
    const data={app:'我的記帳本',version:1,exported:new Date().toISOString(),profile:{budget,goal},accounts:accs,recurring:recs,transactions:all};
    const json=JSON.stringify(data);
    const name='記帳備份-'+ymd(new Date())+'.json';
    if(!(await saveFile(name,new Blob([json],{type:'application/json'})))){toast('已取消備份');return}
    profileObj=Object.assign({},profileObj,{lastBackup:new Date().toISOString()});
    try{await store.setProfile(profileObj)}catch(e){}
    renderBackup();coins(8);bounce($('pigS'));toast('備份完成，共 '+all.length+' 筆明細');
  }catch(x){toast('備份失敗，請再試一次')}
  finally{btns.forEach(b=>b.disabled=false)}
}
$('bkBtn').onclick=doBackup;$('rGo').onclick=doBackup;
$('rLater').onclick=()=>{try{sessionStorage.setItem('ledger.snooze','1')}catch(e){}$('remind').hidden=true};
$('bkEvery').addEventListener('change',async()=>{
  profileObj=Object.assign({},profileObj,{backupEvery:Number($('bkEvery').value)});
  try{await store.setProfile(profileObj);renderBackup();toast(profileObj.backupEvery?'會每 '+profileObj.backupEvery+' 天提醒你備份':'已關閉備份提醒')}catch(e){toast('儲存失敗，請再試一次')}
});
let pendingRestore=null;
$('rsBtn').onclick=()=>$('rsFile').click();
$('rsFile').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!d||d.app!=='我的記帳本'||!Array.isArray(d.transactions))throw new Error('bad');
    pendingRestore=d;const dt=new Date(d.exported);
    $('rsTxt').textContent='這是 '+dt.getFullYear()+'/'+(dt.getMonth()+1)+'/'+dt.getDate()+' 的備份：'+d.transactions.length+' 筆明細、'+(d.accounts||[]).length+' 個帳戶、'+(d.recurring||[]).length+' 個固定項目。還原後，同一筆資料會換成備份裡的版本，不會重複；備份之後新增的資料會保留。';
    $('rsBox').hidden=false;
  }catch(x){toast('這不是記帳本的備份檔')}
});
$('rsCancel').onclick=()=>{pendingRestore=null;$('rsBox').hidden=true};
$('rsGo').onclick=async()=>{
  const d=pendingRestore;if(!d)return;const go=$('rsGo');go.disabled=true;$('rsCancel').disabled=true;
  const items=[].concat((d.accounts||[]).map(v=>['a',v]),(d.recurring||[]).map(v=>['r',v]),d.transactions.map(v=>['t',v]));
  const put=async([k,v])=>{if(!v||typeof v.id!=='string')return;if(k==='a')await store.saveAcc(v);else if(k==='r')await store.saveRec(v);else await store.save(v)};
  let n=0,fail=0;
  for(const it of items){
    try{await put(it)}catch(x){await new Promise(r=>setTimeout(r,800));try{await put(it)}catch(y){fail++}}
    n++;if(n%10===0||n===items.length)go.textContent='還原中 '+n+'/'+items.length;
  }
  try{if(d.profile){profileObj=Object.assign({},profileObj,{budget:Number(d.profile.budget)||0,goal:Number(d.profile.goal)||0});
    await store.setProfile(profileObj);budget=profileObj.budget;goal=profileObj.goal}}catch(x){fail++}
  go.disabled=false;$('rsCancel').disabled=false;go.textContent='確定還原';$('rsBox').hidden=true;pendingRestore=null;
  render();renderAcc();renderRec();
  if(fail)toast('還原完成，但有 '+fail+' 筆沒寫入，可以再還原一次');else{toast('還原完成！');coins(20)}
};

/* ---------- export ---------- */
async function saveFile(name,blob){
  // 手機：用分享選單（可存到 iCloud 雲碟、Google 雲端硬碟或寄信）；電腦：直接下載
  const touch=(()=>{try{return matchMedia('(pointer:coarse)').matches}catch(e){return false}})();
  if(touch&&navigator.canShare&&window.File){
    const file=new File([blob],name,{type:blob.type||'application/octet-stream'});
    if(navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:name});return true}
      catch(e){if(e&&e.name==='AbortError')return false}
    }
  }
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);return true;
}
$('exportBtn').onclick=async()=>{
  const rows=[['日期','類型','分類','金額','付款方式','備註']].concat(txs.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.type==='inc'?'收入':'支出',catOf(t.type,t.cat)[1],t.amount,(t.pay&&t.pay.label)||'',t.note||'']));
  const csv='﻿'+rows.map(r=>r.map(v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n');
  try{await saveFile('記帳-'+monthKey()+'.csv',new Blob([csv],{type:'text/csv'}))}catch(x){}
};

  $('skinGreen').setAttribute('aria-pressed',String(!w));$('skinWhite').setAttribute('aria-pressed',String(w));

/* ---------- Firebase login ---------- */
if(!window.firebase){notice('載入失敗，請確認網路後重新打開。','warn');return}
firebase.initializeApp(FIREBASE_CONFIG);
const auth=firebase.auth();const fdb=firebase.firestore();
try{fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
$('loginPig').innerHTML=pigSVG('happy',0,'G');
let signUp=false;
const AUTH_MSG={'auth/invalid-credential':'Email 或密碼不對','auth/wrong-password':'Email 或密碼不對','auth/user-not-found':'找不到這個帳號，要不要先建立一個？',
  'auth/email-already-in-use':'這個 Email 已經註冊過了，直接登入就好','auth/weak-password':'密碼至少要 6 個字','auth/invalid-email':'Email 格式不對',
  'auth/too-many-requests':'嘗試太多次了，請稍後再試','auth/network-request-failed':'連不上網路，請檢查後再試','auth/missing-email':'請先輸入 Email'};
const lErr=m=>{$('lOk').hidden=true;$('lErr').textContent=m;$('lErr').hidden=!m};
$('lSwitch').onclick=()=>{signUp=!signUp;lErr('');$('lGo').textContent=signUp?'建立帳號':'登入';
  $('lSwitch').textContent=signUp?'已經有帳號了？登入':'還沒有帳號？建立一個';
  $('lPass').setAttribute('autocomplete',signUp?'new-password':'current-password');
  $('loginSub').textContent=signUp?'用 Email 建立一個帳號，換手機也能登入看到資料':'登入後，資料會安全地存在你自己的雲端帳號'};
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();lErr('');
  const em=$('lEmail').value.trim(),pw=$('lPass').value;$('lGo').disabled=true;
  try{if(signUp)await auth.createUserWithEmailAndPassword(em,pw);else await auth.signInWithEmailAndPassword(em,pw)}
  catch(x){lErr(AUTH_MSG[x&&x.code]||'登入失敗，請再試一次')}
  finally{$('lGo').disabled=false}});
$('lForgot').onclick=async()=>{const em=$('lEmail').value.trim();if(!em){lErr('請先在上面輸入你的 Email');return}
  try{await auth.sendPasswordResetEmail(em);lErr('');$('lOk').textContent='已寄出重設密碼的信到 '+em+'，請到信箱收信';$('lOk').hidden=false}
  catch(x){lErr(AUTH_MSG[x&&x.code]||'寄送失敗，請再試一次')}};
$('logout').onclick=async()=>{try{await auth.signOut()}catch(e){}location.reload()};
let started=false;
auth.onAuthStateChanged(u=>{
  if(!u){$('login').hidden=false;$('who').hidden=true;return}
  $('login').hidden=true;$('whoEmail').textContent=u.email||'';$('who').hidden=false;
  if(!started){started=true;startApp(u.uid)}
});
function startApp(uid){
  store=dbStore(fdb,uid);
  store.watchProfile(p=>{profileObj=Object.assign({},p);profLoaded=true;budget=Number(p.budget||0);goal=Number(p.goal||0);render();renderAcc();renderRec();renderBackup()});
  store.watchAccounts(v=>{const first=!accLoaded;accs=v;accLoaded=true;renderAcc();renderBackup();if(first)catchUp()});
  store.watchRecurring(v=>{const first=!recLoaded;recs=v;recLoaded=true;renderRec();renderBackup();if(first)catchUp()});
  subscribe();
}
})();
